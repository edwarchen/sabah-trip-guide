  <style>
    :root {
      color-scheme: light;
      --bg: #fff8ee;
      --surface: #fffdf8;
      --ink: #35263d;
      --muted: #6d6172;
      --coral: #ff8068;
      --sun: #ffc75f;
      --sea: #4fc9c4;
      --deep: #163447;
    }

    :root[data-theme="night"] {
      color-scheme: dark;
      --bg: #091b2a;
      --surface: #102b3d;
      --ink: #f7f2ed;
      --muted: #b9c8d4;
      --coral: #ff927d;
      --sun: #ffd27a;
      --sea: #59d4cf;
      --deep: #06121d;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-width: 320px; }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 8px; }
    main { width: min(100% - 24px, 760px); margin: 0 auto; padding: 18px 0 64px; }
    section { margin-bottom: 28px; scroll-margin-top: 16px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 0 4px 12px; }
    .section-head h2 { margin: 0; font-size: clamp(1.35rem, 5vw, 2rem); line-height: 1.1; }
    .section-kicker { margin: 0 0 5px; color: var(--coral); font-size: .78rem; font-weight: 850; letter-spacing: .1em; }
    .section-note { margin: 0; color: var(--muted); font-size: .82rem; text-align: right; }
    .card { border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 24px; background: var(--surface); box-shadow: 0 10px 30px rgb(22 52 71 / .08); }
    .now-card { border-radius: 28px; padding: 22px; background: linear-gradient(135deg, var(--coral), var(--sun)); color: #2f2037; box-shadow: 0 14px 36px rgb(22 52 71 / .14); }
    .eyebrow { margin: 0 0 8px; font-size: .82rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .now-card h1 { margin: 0; font-size: clamp(1.55rem, 7vw, 2.8rem); line-height: 1.08; }
    .now-meta { margin: 10px 0 0; line-height: 1.55; }
    .countdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
    .countdown span { padding: 12px 8px; border-radius: 18px; text-align: center; background: rgb(255 255 255 / .55); }
    .countdown strong { display: block; font-size: clamp(1.8rem, 10vw, 3.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
    .countdown small { display: block; margin-top: 6px; font-weight: 750; }
    .map-card { overflow: hidden; padding: 12px; }
    .overview-svg { display: block; width: 100%; height: auto; min-height: 280px; }
    .overview-svg text { fill: var(--ink); font-family: inherit; font-size: 13px; font-weight: 800; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .overview-svg .land { fill: color-mix(in srgb, var(--sun) 52%, var(--surface)); stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .overview-svg .sea-doodle { fill: none; stroke: color-mix(in srgb, var(--sea) 60%, transparent); stroke-width: 2; stroke-linecap: round; }
    .overview-svg .route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; }
    .overview-svg .node { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
    .overview-svg .stay { fill: var(--sun); stroke: var(--ink); stroke-width: 1.5; }
    .day-1 { stroke: #ef6a5b; } .day-2 { stroke: #f5a623; } .day-3 { stroke: #22a6b3; }
    .day-4 { stroke: #7b61ff; } .day-5 { stroke: #2f80ed; } .day-6 { stroke: #ef476f; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 8px 8px 4px; color: var(--muted); font-size: .78rem; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 18px; height: 4px; border-radius: 99px; background: currentColor; }
    .legend .stay-key::before { content: "☾"; color: var(--ink); }
    .booking-grid { display: grid; gap: 12px; }
    .booking-card { padding: 18px; }
    .booking-card h3 { margin: 0 0 4px; font-size: 1.08rem; }
    .booking-card p { margin: 6px 0 0; color: var(--muted); line-height: 1.55; overflow-wrap: anywhere; }
    .flight-line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 14px; }
    .flight-line strong { display: block; font-size: 1.35rem; color: var(--ink); }
    .flight-line span:last-child { text-align: right; }
    .plane { color: var(--sea); font-weight: 900; }
    .hotel-row { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
    .hotel-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: color-mix(in srgb, var(--sea) 24%, transparent); }
    .day-list { display: grid; gap: 14px; }
    .day-card { overflow: hidden; }
    .day-header { padding: 17px 18px 14px; border-top: 7px solid var(--day-color); }
    .day-header .date { color: var(--muted); font-size: .82rem; font-weight: 800; letter-spacing: .05em; }
    .day-header h3 { margin: 4px 0 0; font-size: 1.18rem; }
    .timeline { margin: 0; padding: 2px 18px 18px; list-style: none; }
    .timeline li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px dashed color-mix(in srgb, var(--ink) 18%, transparent); }
    .timeline time { color: var(--muted); font-size: .82rem; font-weight: 800; line-height: 1.4; }
    .timeline h4 { margin: 0; font-size: .98rem; }
    .timeline p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
    .badge { display: inline-flex; align-items: center; min-height: 26px; margin-top: 8px; padding: 3px 9px; border-radius: 99px; font-size: .75rem; font-weight: 850; }
    .badge-confirmed { color: #075f59; background: #c7f2e9; }
    .badge-unconfirmed { color: #6b4c00; background: #ffe9a9; }
    .badge-booking { color: #154f91; background: #d8eaff; }
    .badge-risk { color: #8c2636; background: #ffd9df; }
    .place-link { display: inline-flex; align-items: center; min-height: 44px; margin: -8px -8px -8px 0; padding: 8px; color: var(--ink); font-weight: 800; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .place-link::after { content: "↗"; margin-left: 5px; color: var(--sea); }
    .day-route { border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
    .day-route summary { min-height: 48px; padding: 14px 18px; cursor: pointer; color: var(--ink); font-weight: 850; list-style-position: inside; }
    .route-panel { padding: 0 18px 16px; }
    .mini-route { display: block; width: 100%; height: 116px; border-radius: 18px; background: color-mix(in srgb, var(--sea) 11%, var(--surface)); }
    .mini-route path { fill: none; stroke: var(--day-color); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 8 7; }
    .mini-route circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
    .mini-route text { fill: var(--ink); font-family: inherit; font-size: 10px; font-weight: 750; }
    .route-stops { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .route-stops a, .route-stops span { display: inline-flex; align-items: center; min-height: 34px; padding: 5px 9px; border-radius: 99px; background: color-mix(in srgb, var(--sea) 14%, transparent); color: var(--ink); font-size: .76rem; font-weight: 750; }
    .route-action { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 16px; border-radius: 15px; background: var(--deep); color: #fff; font-weight: 850; text-decoration: none; }
    .online-note { margin-left: 9px; color: var(--muted); font-size: .76rem; }
    .plain-list { margin: 0; padding: 4px 18px 14px 42px; }
    .plain-list li { padding: 9px 0; line-height: 1.55; }
    .tip-grid { display: grid; gap: 10px; }
    .tip { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 14px 16px; }
    .tip b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: color-mix(in srgb, var(--coral) 20%, transparent); }
    .tip p { margin: 0; color: var(--muted); line-height: 1.55; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .offline-status { position: fixed; z-index: 20; right: 12px; bottom: 12px; left: 12px; width: min(560px, calc(100% - 24px)); margin: auto; padding: 12px 16px; border-radius: 16px; background: var(--deep); color: #fff; box-shadow: 0 10px 28px rgb(0 0 0 / .25); font-size: .86rem; }
    @media (min-width: 900px) {
      main { width: min(100% - 64px, 1040px); }
      .booking-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 380px) {
      .timeline li { grid-template-columns: 72px minmax(0, 1fr); gap: 8px; }
      .now-card { padding: 18px; }
    }
    @media (max-width: 430px) {
      main { width: min(100% - 20px, 410px); }
      .card, .now-card { max-width: 100%; }
      .flight-line { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); font-size: .78rem; }
      .plane { font-size: .72rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>

  <script id="app-script">
    (() => {
      "use strict";

      function parseTripData(jsonText) {
        const value = JSON.parse(jsonText);
        if (!Array.isArray(value.events) || !Array.isArray(value.places) || !Array.isArray(value.days)) {
          throw new TypeError("Trip data must contain events, places and days arrays");
        }
        return value;
      }

      function findNextEvent(events, nowMs = Date.now()) {
        return [...events]
          .sort((a, b) => Date.parse(a.startsAt) - Date.parse(b.startsAt))
          .find((event) => Date.parse(event.startsAt) > nowMs) ?? null;
      }

      function getCountdownParts(targetMs, nowMs = Date.now()) {
        const totalMinutes = Math.max(0, Math.floor((targetMs - nowMs) / 60000));
        return {
          days: Math.floor(totalMinutes / 1440),
          hours: Math.floor((totalMinutes % 1440) / 60),
          minutes: totalMinutes % 60,
        };
      }

      function getMalaysiaHour(date = new Date()) {
        return Number(new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Kuala_Lumpur",
          hour: "2-digit",
          hourCycle: "h23",
        }).format(date));
      }

      function getThemeForHour(hour) {
        return hour >= 6 && hour < 18 ? "day" : "night";
      }

      function buildGoogleMapsPlaceUrl(query) {
        if (!query) return null;
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      }

      function buildGoogleMapsRouteUrl(places) {
        const seen = new Set();
        const confirmed = places.filter((place) => {
          if (!place || !place.mapsQuery || !place.routeEligible || seen.has(place.mapsQuery)) return false;
          seen.add(place.mapsQuery);
          return true;
        });
        if (confirmed.length < 2) return null;
        const params = new URLSearchParams({
          api: "1",
          origin: confirmed[0].mapsQuery,
          destination: confirmed.at(-1).mapsQuery,
          travelmode: "driving",
        });
        const waypoints = confirmed.slice(1, -1).map((place) => place.mapsQuery);
        if (waypoints.length) params.set("waypoints", waypoints.join("|"));
        return `https://www.google.com/maps/dir/?${params}`;
      }

      function buildDayRouteUrls(day, places) {
        const placeById = new Map(places.map((place) => [place.id, place]));
        const segments = Array.isArray(day.routeSegments) ? day.routeSegments : [];
        return segments.map((placeIds, index) => ({
          label: segments.length === 1 ? "打开全天陆路路线" : `打开陆路路线 ${index + 1}`,
          url: buildGoogleMapsRouteUrl(placeIds.map((id) => placeById.get(id))),
        })).filter((item) => item.url);
      }

      function formatEventTime(startsAt, timezoneLabel) {
        const timeZone = timezoneLabel.startsWith("Asia/Shanghai") ? "Asia/Shanghai" : "Asia/Kuala_Lumpur";
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone,
          month: "long",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).format(new Date(startsAt));
      }

      function renderNow(trip, nowMs = Date.now()) {
        const mount = document.getElementById("now");
        const event = findNextEvent(trip.events, nowMs);
        if (!event) {
          mount.innerHTML = '<article class="now-card"><p class="eyebrow">此刻关注</p><h1>旅程已结束</h1><p class="now-meta">愿这趟沙巴之旅，留下很多蓝色的回忆。</p></article>';
          return;
        }
        const remaining = getCountdownParts(Date.parse(event.startsAt), nowMs);
        mount.innerHTML = `
          <article class="now-card" aria-live="polite">
            <p class="eyebrow">此刻关注 · 下一个事件</p>
            <h1>${event.title}</h1>
            <p class="now-meta">${event.location}<br><time datetime="${event.startsAt}">${formatEventTime(event.startsAt, event.timezoneLabel)}</time><br>${event.timezoneLabel}</p>
            <div class="countdown" aria-label="倒计时 ${remaining.days}天 ${remaining.hours}小时 ${remaining.minutes}分钟">
              <span><strong>${remaining.days}</strong><small>天</small></span>
              <span><strong>${String(remaining.hours).padStart(2, "0")}</strong><small>时</small></span>
              <span><strong>${String(remaining.minutes).padStart(2, "0")}</strong><small>分</small></span>
            </div>
          </article>`;
      }

      const statusMeta = {
        confirmed: ["✓", "已确认"],
        unconfirmed: ["?", "待确认"],
        booking: ["↗", "需预订"],
        risk: ["!", "风险"],
      };

      function statusBadge(status) {
        const [icon, label] = statusMeta[status] ?? ["·", status];
        return `<span class="badge badge-${status}"><span aria-hidden="true">${icon}&nbsp;</span>${label}</span>`;
      }

      function renderBookings(trip) {
        const flights = trip.flights.map((flight) => `
          <article class="card booking-card">
            <p class="section-kicker">✈ ${flight.date} · 已确认</p>
            <h3>${flight.flight}</h3>
            <div class="flight-line"><span><strong>${flight.departTime}</strong>${flight.depart}</span><span class="plane" aria-hidden="true">━━✈</span><span><strong>${flight.arriveTime}</strong>${flight.arrive}</span></div>
            <p>${flight.timezone}</p>
          </article>`).join("");
        const placeById = new Map(trip.places.map((place) => [place.id, place]));
        const hotels = trip.hotels.map((hotel) => {
          const place = placeById.get(hotel.id);
          const placeUrl = buildGoogleMapsPlaceUrl(place?.mapsQuery);
          return `
          <article class="card booking-card hotel-row">
            <span class="hotel-icon" aria-hidden="true">▦</span>
            <div><p class="section-kicker">HOTEL · 已确认</p><h3>${placeUrl ? `<a class="place-link" href="${placeUrl}" target="_blank" rel="noopener noreferrer">${hotel.name}</a>` : hotel.name}</h3><p><b>${hotel.stay}</b><br>${hotel.room}<br>地址：${hotel.address}<br>电话：${hotel.phone}<br>${hotel.note}</p></div>
          </article>`;
        }).join("");
        document.querySelector("[data-bookings]").innerHTML = flights + hotels;
      }

      function renderMiniRoute(places) {
        const count = Math.max(places.length, 2);
        const points = places.map((place, index) => ({
          place,
          x: 34 + (index * 252) / (count - 1),
          y: index % 2 ? 69 : 45,
        }));
        const path = points.map((point, index) => `${index ? "L" : "M"}${point.x} ${point.y}`).join(" ");
        return `<svg class="mini-route" viewBox="0 0 320 116" role="img" aria-label="当日手绘路线"><path d="${path}"/>${points.map(({ place, x, y }, index) => `<circle cx="${x}" cy="${y}" r="6"/><text x="${Math.max(4, Math.min(x - 22, 270))}" y="${y + (index % 2 ? -13 : 22)}">${place.label.slice(0, 8)}</text>`).join("")}</svg>`;
      }

      function renderDays(trip) {
        const placeById = new Map(trip.places.map((place) => [place.id, place]));
        document.querySelector("[data-days]").innerHTML = trip.days.map((day, dayIndex) => {
          const routePlaces = day.routePlaceIds.map((id) => placeById.get(id)).filter(Boolean);
          const routeActions = buildDayRouteUrls(day, trip.places);
          const routeStops = routePlaces.map((place) => {
            const url = buildGoogleMapsPlaceUrl(place.mapsQuery);
            return url ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${place.label} ↗</a>` : `<span>${place.label}</span>`;
          }).join("");
          return `
          <article class="card day-card" style="--day-color:${day.color}">
            <header class="day-header"><span class="date">DAY ${dayIndex + 1} · ${day.date} · Asia/Kuala_Lumpur · UTC+8</span><h3>${day.title}</h3></header>
            <ol class="timeline">${day.items.map((item) => `
              <li><time>${item.time}</time><div><h4>${(() => { const place = item.placeId ? placeById.get(item.placeId) : null; const url = buildGoogleMapsPlaceUrl(place?.mapsQuery); return url ? `<a class="place-link" href="${url}" target="_blank" rel="noopener noreferrer">${item.title}</a>` : item.title; })()}</h4><p>${item.detail}</p>${statusBadge(item.status)}</div></li>`).join("")}</ol>
            <details class="day-route"><summary>展开当日路线</summary><div class="route-panel">${renderMiniRoute(routePlaces)}<div class="route-stops">${routeStops}</div>${routeActions.map((action) => `<a class="route-action" href="${action.url}" target="_blank" rel="noopener noreferrer">${action.label} ↗</a>`).join(" ")}<span class="online-note">导航需联网</span></div></details>
          </article>`;
        }).join("");
      }

      function renderLists(trip) {
        document.querySelector("[data-todos]").innerHTML = trip.todos.map((item) => `<li>${item}</li>`).join("");
        const tipIcons = ["◷", "✈", "☾", "≈", "▣", "☀", "⌖", "＋"];
        document.querySelector("[data-tips]").innerHTML = trip.tips.map((item, index) => `<article class="card tip"><b aria-hidden="true">${tipIcons[index] ?? "•"}</b><p>${item}</p></article>`).join("");
      }

      function bootTripGuide() {
        const trip = parseTripData(document.getElementById("trip-data").textContent);
        const updateTheme = () => {
          document.documentElement.dataset.theme = getThemeForHour(getMalaysiaHour());
        };
        updateTheme();
        renderNow(trip);
        renderBookings(trip);
        renderDays(trip);
        renderLists(trip);
        setInterval(() => renderNow(trip), 30000);
        setInterval(updateTheme, 300000);
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {
              document.querySelector("#offline-status").hidden = false;
            });
          }, { once: true });
        }
      }

      globalThis.TripGuide = {
        parseTripData,
        findNextEvent,
        getCountdownParts,
        getMalaysiaHour,
        getThemeForHour,
        buildGoogleMapsPlaceUrl,
        buildGoogleMapsRouteUrl,
        buildDayRouteUrls,
      };

      if (typeof document !== "undefined") {
        bootTripGuide();
      }
    })();
  </script>
